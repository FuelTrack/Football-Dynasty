<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140f24"><title>Football Dynasty</title>
<style>

min-height:250px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;padding:15px}.dot{border-radius:100%;width:48px;height:48px;display:grid;place-items:center;background:#8c4ee8;border:2px solid white;font-size:.75rem}#fatal{background:#3c1b29;padding:20px;border-radius:12px;display:none}footer{color:#9c8ab1;text-align:center;padding:25px}@media(max-width:550px){header{align-items:flex-start;flex-direction:column}.wrap{padding:16px}.panel{padding:17px}.score{font-size:2rem}}

<header><div><div class="brand">FD / FOOTBALL DYNASTY</div><h1>Build your football legacy</h1></div><span class="muted">Alpha 1.0 · Real Club Draft</span></header>
<main class="wrap"><div id="fatal" role="alert"></div><div id="app"><section class="panel hero"><h2>Football Dynasty is loading…</h2><p>If this message remains, the game script has not started.</p></section></div></main>
<footer>Fictional clubs and players · Free to play · Your career saves on this device</footer>
<script>
(function(){
'use strict';
var names=['Crown Athletic','Northbridge FC','Harbour City','Kingsport United','Redwood Rovers','Westmere Albion','Riverside 1889','Ironvale FC','Southbank Town','Oakchester','Eastford Wanderers','Bluehaven FC','Ashfield United','Silverton City','Lakeside Athletic','Stonebridge Town','Greenmoor Rovers','Hillcrest FC','Port Victoria','Falconborough'];
var cities=['London','Manchester','Liverpool','Newcastle','Nottingham','Birmingham','Leeds','Sheffield','Bristol','Leicester','Norwich','Derby','Plymouth','York','Oxford','Reading','Coventry','Exeter','Sunderland'];
var first=['Leo','Mason','Elliot','Noah','Oscar','Theo','Max','Isaac','Sam','Finn','Luca','Jamie','Jude','Alex','Harry','Ben','Owen','Callum','Rhys','Tom','Jack','Ethan'];
var last=['Mercer','Vale','Rowan','Hale','Bennett','Sutton','Webb','Cross','Warren','Keane','Drake','Holt','Marsh','Frost','Reid','Parker','Stone','Brooks','Flynn','Cole','Doyle','Hart'];
var clubs=names.map(function(n,i){return {name:n,city:cities[i],strength:78-i,players:Array.from({length:22},function(_,j){return {name:first[(j+i)%first.length]+' '+last[(j*3+i)%last.length],position:j<2?'GK':j<9?'DEF':j<16?'MID':'FWD',age:18+(j*2+i)%16,rating:Math.max(55,78-i+(j*7+i*3)%11-5),fitness:88+(j+i)%13,value:Math.max(.5,Math.round((78-i+(j*7+i*3)%11-5)*.12*10)/10),contract:2+(j%4),potential:Math.min(95,Math.max(55,78-i+(j*7+i*3)%11-5)+4+(j%8))}})}})
var save={name:'',club:-1,tab:'Dashboard',played:0,result:null,formation:'4-3-3',mentality:'Balanced',pressing:'Standard',wins:0,draws:0,losses:0,results:[],season:1,leagueGames:[],archive:[],leagueSection:'Table',funds:35,rosters:null,training:'Balanced',transfers:[]};
try{var raw=localStorage.getItem('football-dynasty-standalone');if(raw){var parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')save=Object.assign(save,parsed)}}catch(e){}
if(!Array.isArray(save.results))save.results=[];if(!Array.isArray(save.leagueGames))save.leagueGames=[];if(save.leagueGames.length&&save.leagueGames[0].length!==10){save.legacyPlayed=(save.legacyPlayed||0)+save.leagueGames.length;save.leagueGames=[];save.played=0;save.result=null;}if(!Array.isArray(save.archive))save.archive=[];if(!save.season)save.season=1;if(save.played&&!save.leagueGames.length){save.legacyPlayed=save.played;save.played=0}save.played=save.leagueGames.length;if(!Array.isArray(save.rosters)||save.rosters.length!==clubs.length)save.rosters=clubs.map(function(c){return c.players.map(function(p){return Object.assign({},p)})});if(!Array.isArray(save.transfers))save.transfers=[];if(!Number.isFinite(save.funds))save.funds=35;save.rosters.forEach(function(roster,i){roster.forEach(function(p,j){if(!Number.isFinite(p.value))p.value=Math.max(.5,Math.round(p.rating*.12*10)/10);if(!Number.isFinite(p.contract))p.contract=2+(j%4);if(!Number.isFinite(p.potential))p.potential=Math.min(95,p.rating+5+(j%7))})});clubs.forEach(function(c,i){c.players=save.rosters[i]});var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function persist(){try{localStorage.setItem('football-dynasty-standalone',JSON.stringify(save))}catch(e){}}
function btn(label,fn){return '<button class="btn" data-action="'+fn+'">'+label+'</button>'}

var rounds=(function(){var a=clubs.map(function(_,i){return i}),r=[],n=a.length;for(var i=0;i<n-1;i++){var m=[];for(var j=0;j<n/2;j++)m.push(i%2?[a[n-1-j],a[j]]:[a[j],a[n-1-j]]);r.push(m);a=[a[0],a[n-1]].concat(a.slice(1,n-1))}return r.concat(r.map(function(m){return m.map(function(p){return [p[1],p[0]]})}))})();
function nextPair(){var m=rounds[save.played];return m&&m.find(function(p){return p.indexOf(save.club)>=0})}
function simulateLeagueGame(h,a){var d=(clubs[h].strength-clubs[a].strength)*.04,gh=0,ga=0;for(var i=0;i<6;i++){if(Math.random()<(1.4+d)/6)gh++;if(Math.random()<(1.2-d)/6)ga++}var events=[];function goals(team,n){for(var j=0;j<n;j++){var ps=clubs[team].players.filter(function(p){return p.position!=='GK'}),sc=ps[Math.floor(Math.random()*ps.length)],as=Math.random()<.75?ps[Math.floor(Math.random()*ps.length)]:null;events.push({team:team,scorer:sc.name,assist:as&&as.name!==sc.name?as.name:null})}}goals(h,gh);goals(a,ga);return {h:h,a:a,hg:gh,ag:ga,events:events}}
function standings(){var t=clubs.map(function(c,i){return {id:i,name:c.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});save.leagueGames.forEach(function(r){r.forEach(function(g){var h=t[g.h],a=t[g.a];h.p++;a.p++;h.gf+=g.hg;h.ga+=g.ag;a.gf+=g.ag;a.ga+=g.hg;if(g.hg>g.ag){h.w++;a.l++;h.pts+=3}else if(g.hg<g.ag){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}})});return t.sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf})}
function leagueTable(){return '<section class="panel"><h3>Dynasty League · Season '+save.season+'</h3><div class="scroll"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+standings().map(function(t,i){return '<tr style="'+(t.id===save.club?'background:#392455':'')+'"><td>'+(i+1)+'</td><td>'+esc(t.name)+'</td><td>'+t.p+'</td><td>'+t.w+'</td><td>'+t.d+'</td><td>'+t.l+'</td><td>'+(t.gf-t.ga)+'</td><td>'+t.pts+'</td></tr>'}).join('')+'</table></div></section>'}
function calendar(){return '<section class="panel"><h3>Season '+save.season+' · Fixtures</h3>'+rounds.map(function(r,i){return '<details '+(i===save.played?'open':'')+'><summary>Matchday '+(i+1)+(i<save.played?' ✓':'')+'</summary>'+r.map(function(p,j){var g=save.leagueGames[i]&&save.leagueGames[i][j];return '<p>'+esc(clubs[p[0]].name)+' '+(g?g.hg+' — '+g.ag:'vs')+' '+esc(clubs[p[1]].name)+'</p>'}).join('')+'</details>'}).join('')+'</section>'}
function rankings(kind){var list={};save.leagueGames.forEach(function(r){r.forEach(function(g){g.events.forEach(function(e){var key=e.team+'-'+e.scorer;if(!list[key])list[key]={name:e.scorer,club:clubs[e.team].name,goals:0,assists:0};list[key].goals++;if(e.assist){var k=e.team+'-'+e.assist;if(!list[k])list[k]={name:e.assist,club:clubs[e.team].name,goals:0,assists:0};list[k].assists++}})})});return '<section class="panel"><h3>Top '+(kind==='goals'?'Goalscorers':'Assist Providers')+'</h3><div class="scroll"><table><tr><th>#</th><th>Player</th><th>Club</th><th>'+kind+'</th></tr>'+Object.values(list).sort(function(a,b){return b[kind]-a[kind]}).slice(0,20).map(function(p,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.club)+'</td><td>'+p[kind]+'</td></tr>'}).join('')+'</table></div></section>'}
function playRound(){if(save.played>=rounds.length)return;var games=rounds[save.played].map(function(p){return simulateLeagueGame(p[0],p[1])}),g=games.find(function(x){return x.h===save.club||x.a===save.club});save.leagueGames.push(games);save.played=save.leagueGames.length;save.result={home:clubs[g.h].name,away:clubs[g.a].name,hg:g.hg,ag:g.ag,pos:50,shots:8+g.hg*2,oppShots:8+g.ag*2,commentary:'Matchday '+save.played+' complete. All five games simulated.'};save.results.push(save.result.home+' '+g.hg+'–'+g.ag+' '+save.result.away);save.tab='Match Centre';persist();render()}
function nextSeason(){if(save.played!==rounds.length)return;var t=standings(),i=t.findIndex(function(x){return x.id===save.club});save.archive.unshift({season:save.season,champion:t[0].name,position:i+1});save.season++;save.played=0;save.leagueGames=[];save.result=null;save.tab='Dashboard';save.funds+=10+(clubs.length-i)*.7;clubs.forEach(function(c){c.players.forEach(function(p){p.age++;p.contract=Math.max(0,p.contract-1);if(p.age<28&&p.rating<p.potential&&Math.random()<.55){p.rating++;p.value=Math.round(p.value*1.07*10)/10}if(p.age>32&&Math.random()<.3)p.rating=Math.max(40,p.rating-1);p.fitness=Math.min(100,p.fitness+(save.training==='Fitness'?5:2))})});save.rosters=clubs.map(function(c){return c.players});persist();render()}


var live=null,liveTimer=null,liveFrame=null,liveLast=0;
function liveView(){if(!live)return '<p>No match in progress.</p>';var g=live.game,events=g.events.filter(function(e){return e.minute<=live.minute}),home=events.filter(function(e){return e.team===g.h}).length,away=events.filter(function(e){return e.team===g.a}).length;return '<div class="score" id="live-score">'+esc(clubs[g.h].name)+' '+home+' — '+away+' '+esc(clubs[g.a].name)+'</div><p style="text-align:center" id="match-clock"><b>'+Math.min(90,Math.floor(live.minute))+'\'</b> · '+(live.paused?'Paused':'LIVE')+' · '+live.speed+'×</p><canvas id="match-pitch" width="760" height="440" style="display:block;width:100%;max-width:760px;margin:auto;border:3px solid #c2e8cb;border-radius:12px;background:#176f50" aria-label="Animated 2D football match pitch"></canvas><div class="nav" style="justify-content:center;margin-top:16px"><button data-live="pause">'+(live.paused?'Resume':'Pause')+'</button><button data-live="speed">Speed '+live.speed+'×</button><button data-live="skip">Skip to full time</button></div><p class="muted">Match events: '+(events.length?events.map(function(e){return e.minute+'\' ⚽ '+esc(e.scorer)+(e.assist?' (assist: '+esc(e.assist)+')':'')}).join(' · '):'Waiting for kickoff highlights…')+'</p><p class="muted">Matchday '+(save.played+1)+' · All other league fixtures will be completed at full time.</p>'}
function drawPitch(){if(!live||save.tab!=='Match Centre')return;var canvas=document.getElementById('match-pitch');if(!canvas)return;var ctx=canvas.getContext('2d');if(!ctx)return;var w=760,h=440;ctx.fillStyle='#156b4d';ctx.fillRect(0,0,w,h);for(var k=0;k<10;k++){ctx.fillStyle=k%2?'#156b4d':'#197756';ctx.fillRect(k*76,0,76,h)}ctx.strokeStyle='#d7f4e2';ctx.lineWidth=2;ctx.strokeRect(16,16,w-32,h-32);ctx.beginPath();ctx.moveTo(w/2,16);ctx.lineTo(w/2,h-16);ctx.stroke();ctx.beginPath();ctx.arc(w/2,h/2,62,0,Math.PI*2);ctx.stroke();ctx.strokeRect(16,125,110,190);ctx.strokeRect(w-126,125,110,190);ctx.strokeRect(16,175,40,90);ctx.strokeRect(w-56,175,40,90);
var t=live.minute,ballX=w/2+Math.sin(t*.38)*260,ballY=h/2+Math.cos(t*.24)*130;
for(var side=0;side<2;side++){for(var i=0;i<11;i++){var col=i===0?0:i<5?1:i<8?2:3;var row=i===0?0:i<5?i-1:i<8?i-5:i-8;var count=i===0?1:i<5?4:3;var base=side===0?70+col*78:w-70-col*78;var x=base+Math.sin(t*.19+i*1.7+side)*22+(ballX-w/2)*.10;var y=i===0?h/2:55+(row+.5)*(h-110)/count+Math.cos(t*.23+i)*16;ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle=side===0?'#a15af7':'#f5b354';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=side===0?'white':'#281b10';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(String(i+1),x,y+3)}}ctx.beginPath();ctx.arc(ballX,ballY,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#101010';ctx.stroke()}
function liveTick(now){if(!live){liveFrame=null;return}var elapsed=liveLast?Math.min(100,now-liveLast):16;liveLast=now;if(!live.paused){live.minute=Math.min(90,live.minute+elapsed*.001*live.speed*1.5);if(live.minute>=90){finishLive();return}}if(save.tab==='Match Centre'){drawPitch();var clock=document.getElementById('match-clock');if(clock)clock.textContent=Math.floor(live.minute)+"' · "+(live.paused?'Paused':'LIVE')+' · '+live.speed+'×';var score=document.getElementById('live-score');if(score){var ev=live.game.events.filter(function(e){return e.minute<=live.minute});score.textContent=clubs[live.game.h].name+' '+ev.filter(function(e){return e.team===live.game.h}).length+' — '+ev.filter(function(e){return e.team===live.game.a}).length+' '+clubs[live.game.a].name}}liveFrame=requestAnimationFrame(liveTick)}
function beginLive(){if(live||save.played>=rounds.length)return;var games=rounds[save.played].map(function(p){return simulateLeagueGame(p[0],p[1])}),g=games.find(function(x){return x.h===save.club||x.a===save.club});g.events.forEach(function(e){e.minute=5+Math.floor(Math.random()*82)});g.events.sort(function(a,b){return a.minute-b.minute});live={games:games,game:g,minute:0,speed:2,paused:false};save.tab='Match Centre';liveLast=0;render();if(liveFrame)cancelAnimationFrame(liveFrame);liveFrame=requestAnimationFrame(liveTick)}
function finishLive(){if(!live)return;var g=live.game;save.leagueGames.push(live.games);save.played=save.leagueGames.length;save.result={home:clubs[g.h].name,away:clubs[g.a].name,hg:g.hg,ag:g.ag,pos:50,shots:8+g.hg*2,oppShots:8+g.ag*2,commentary:'Full time · '+g.events.map(function(e){return e.minute+'\' '+e.scorer}).join(' · ')};save.results.push(save.result.home+' '+g.hg+'–'+g.ag+' '+save.result.away);live=null;if(liveFrame){cancelAnimationFrame(liveFrame);liveFrame=null}persist();render()}


var realPlayers=[],realStatus='Loading real player database…',playerQuery='',playerNation='All';
fetch('./data/real-players.json').then(function(r){if(!r.ok)throw Error('Data unavailable');return r.json()}).then(function(data){realPlayers=(data.players||[]).map(function(p,i){return Object.assign({},p,{rating:65+(i*17%24),club:'Club unverified',ci:-1,pi:i})});realStatus=realPlayers.length+' licensed player records loaded';render()}).catch(function(){realStatus='Real player database unavailable; fictional players remain playable.';render()});
var realLeagues=[],clubStatus='Loading real clubs…';fetch('./data/real-clubs.json').then(function(r){if(!r.ok)throw Error('Club data unavailable');return r.json()}).then(function(data){realLeagues=data.leagues||[];clubStatus=realLeagues.reduce(function(n,l){return n+l.clubs.length},0)+' real clubs available';render()}).catch(function(){clubStatus='Real club data unavailable';render()});var gameMode='Manager Career',draft=null;
function draftNew(){draft={formation:'4-3-3',difficulty:'Classic',source:'Real players',league:'Premier League',team:'',picks:[],offer:null,finished:false,record:null};draftSpin()}
function draftSlots(){return ['GK','DEF','DEF','DEF','DEF','MID','MID','MID','FWD','FWD','FWD']}
function draftSpin(){if(!draft||draft.finished)return;var pool=[];var source=draft.source==='Real players'&&realPlayers.length?realPlayers:null;if(source){source.forEach(function(p){if(!draft.picks.some(function(x){return x.name===p.name&&x.club===p.club}))pool.push(p)})}else{clubs.forEach(function(c,ci){c.players.forEach(function(p,pi){if(!draft.picks.some(function(x){return x.ci===ci&&x.pi===pi}))pool.push({ci:ci,pi:pi,name:p.name,position:p.position,rating:p.rating,club:c.name})})})}draft.offer=pool.length?pool[Math.floor(Math.random()*pool.length)]:null}
function draftFinish(){var avg=draft.picks.reduce(function(n,p){return n+(p?p.rating:0)},0)/11;var wins=0,draws=0,losses=0;for(var i=0;i<38;i++){var quality=Math.max(.08,Math.min(.97,.55+(avg-76)*.027));var roll=Math.random();if(roll<quality){wins++}else if(roll<quality+(1-quality)*.43){draws++}else{losses++}}draft.record={w:wins,d:draws,l:losses,pts:wins*3+draws,avg:avg};draft.finished=true;draft.offer=null}
function draftView(){if(!draft)draftNew();var slots=draftSlots();var out='<section class="panel hero"><h2>38-0-0 Challenge</h2><p>Draft real or fictional players, choose a real club to represent, and aim for a perfect 38-win season.</p><p class="muted">An original Football Dynasty draft mode inspired by the 38-0-0 challenge.</p></section><section class="panel"><h3>Draft your perfect XI · '+draft.picks.filter(Boolean).length+'/11</h3><div class="nav"><button data-draft="new">New challenge</button><button data-draft="difficulty">Mode: '+draft.difficulty+'</button><button data-draft="source">Players: '+draft.source+'</button></div><p class="muted">'+esc(realStatus)+' · '+esc(clubStatus)+'</p><label>League<select id="draft-league">'+realLeagues.map(function(l){return '<option '+(draft.league===l.league?'selected':'')+'>'+esc(l.league)+'</option>'}).join('')+'</select></label><label>Your club<select id="draft-team"><option value="">Choose club</option>'+((realLeagues.find(function(l){return l.league===draft.league})||{clubs:[]}).clubs.map(function(c){return '<option '+(draft.team===c?'selected':'')+'>'+esc(c)+'</option>'}).join(''))+'</select></label><p class="muted">Club names come from 2025–26 league records. Player-to-club affiliations are not verified in the current player dataset.</p><div class="grid">'+slots.map(function(slot,i){var p=draft.picks[i];return '<div style="padding:12px;border:1px solid #654784;border-radius:10px"><b>'+(i+1)+'. '+slot+'</b><p>'+(p?esc(p.name)+' · '+esc(p.club)+(draft.difficulty==='Classic'?' · '+p.rating+' OVR':''):'Available')+'</p></div>'}).join('')+'</div></section>';
if(draft.finished){var r=draft.record;out+='<section class="panel hero"><h2>Season complete</h2><div class="score">'+r.w+' - '+r.d+' - '+r.l+'</div><p>'+r.pts+' points · Average XI rating '+r.avg.toFixed(1)+'</p><h3>'+(r.w===38?'PERFECT SEASON!':r.w>=30?'Title contenders':r.w>=22?'European challengers':r.w>=14?'Mid-table finish':'Relegation battle')+'</h3>'+btn('Draft another XI','draftReset')+'</section>';return out}
if(draft.picks.filter(Boolean).length===11){out+='<section class="panel"><h3>Starting XI complete</h3>'+btn('Simulate 38-match season','draftFinish')+'</section>';return out}
var offer=draft.offer;if(!offer){out+='<section class="panel"><p>Player data is still loading. Try again shortly.</p>'+btn('Draw player','draftSpin')+'</section>';return out}out+='<section class="panel"><h3>Player draw</h3><p>Round '+(draft.picks.filter(Boolean).length+1)+' · '+esc(offer.club)+'</p><h2>'+esc(offer.name)+'</h2><p>'+offer.position+(draft.difficulty==='Classic'?' · '+offer.rating+' OVR':' · Rating hidden')+'</p><p class="muted">Select an open '+offer.position+' slot or spin for a different player.</p><div class="nav">'+slots.map(function(slot,i){return slot===offer.position&&!draft.picks[i]?'<button data-draft-slot="'+i+'">Draft to '+slot+' '+(i+1)+'</button>':''}).join('')+'</div>'+btn('Spin again','draftSpin')+'</section>';return out}
function render(){

if(save.tab==='Dashboard'){out+='<div class="stats"><div>Transfer budget<b>£'+save.funds.toFixed(1)+'m</b></div><div>Club reputation<b>'+club.strength+'</b></div><div>Matches played<b>'+save.played+'</b></div></div><section class="panel"><h3>Next fixture</h3><p>'+(pair?esc(clubs[pair[0]].name)+' vs '+esc(clubs[pair[1]].name):'Season complete')+'</p>'+(pair?btn('Watch 2D Matchday '+(save.played+1),'watch')+' '+btn('Quick Simulate','quickSim'):btn('Start next season','nextSeason'))+'</section><section class="panel"><h3>Key players</h3>'+club.players.slice().sort(function(a,b){return b.rating-a.rating}).slice(0,5).map(function(p){return '<p>'+esc(p.name)+' · '+p.position+' · '+p.rating+' OVR</p>'}).join('')+'</section>'}

if(save.tab==='Season Stats'){out+='<section class="panel"><h3>Your career record</h3><div class="stats"><div>Wins<b>'+ (save.wins||0) +'</b></div><div>Draws<b>'+ (save.draws||0) +'</b></div><div>Losses<b>'+ (save.losses||0) +'</b></div><div>Points<b>'+ ((save.wins||0)*3+(save.draws||0)) +'</b></div></div></section><section class="panel"><h3>Recent results</h3>'+(save.results.length?save.results.slice().reverse().map(function(x){return '<p style="border-bottom:1px solid #3b2b50;padding:9px 0">'+esc(x)+'</p>'}).join(''):'<p>No games played yet.</p>')+'</section>'}
if(save.tab==='Player Database'){var filtered=realPlayers.filter(function(p){return (playerNation==='All'||p.nation===playerNation)&&p.name.toLowerCase().includes(playerQuery.toLowerCase())}).slice(0,100);out+='<section class="panel"><h3>Real Player Database</h3><p class="muted">'+esc(realStatus)+' · Nationality-based records, not verified current top-five league squads. Ratings are fictional game estimates.</p><label>Search<input id="player-search" value="'+esc(playerQuery)+'" placeholder="Search players"></label><label>Nationality<select id="player-nation">'+['All','England','Spain','Germany','Italy','France'].map(function(n){return '<option '+(playerNation===n?'selected':'')+'>'+n+'</option>'}).join('')+'</select></label><div class="scroll"><table><tr><th>Name</th><th>Nation</th><th>Position</th><th>Birth year</th><th>Game rating</th></tr>'+filtered.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.nation+'</td><td>'+p.position+'</td><td>'+p.birthYear+'</td><td>'+p.rating+'</td></tr>'}).join('')+'</table></div></section>'}
if(save.tab==='Finances'){out+='<section class="panel"><h3>Club Finances</h3><div class="stats"><div>Transfer funds<b>£'+save.funds.toFixed(1)+'m</b></div><div>Squad size<b>'+club.players.length+'</b></div><div>Squad market value<b>£'+club.players.reduce(function(n,p){return n+(p.value||0)},0).toFixed(1)+'m</b></div><div>Club reputation<b>'+club.strength+'</b></div></div><h3>Transfer activity</h3>'+(save.transfers.length?save.transfers.slice().reverse().map(function(x){return '<p>'+esc(x)+'</p>'}).join(''):'<p>No transfers yet.</p>')+'<p class="muted">Your transfer budget changes when you buy, sell, renew contracts or begin a new season.</p></section>'}
if(save.tab==='Transfers'){out+='<section class="panel"><h3>Transfer market</h3><p class="muted">Available budget: £'+save.funds.toFixed(1)+'m. Buy players from rival clubs or sell your own players.</p><div class="scroll"><table><tr><th>Player</th><th>Club</th><th>Position</th><th>Rating</th><th>Value</th><th>Action</th></tr>'+clubs.map(function(c,ci){return c.players.filter(function(p){return p.position!=='GK'}).slice(0,7).map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+esc(c.name)+'</td><td>'+p.position+'</td><td>'+p.rating+'</td><td>£'+p.value.toFixed(1)+'m</td><td><button class="btn secondary" data-transfer="'+ci+':'+p.name+'">'+(ci===save.club?'Sell':'Buy')+'</button></td></tr>'}).join('')}).join('')+'</table></div></section>'}
if(save.tab==='Contracts'){out+='<section class="panel"><h3>Contracts</h3><p class="muted">Renew a contract for 3 seasons at 10% of player value. Budget: £'+save.funds.toFixed(1)+'m.</p><div class="scroll"><table><tr><th>Player</th><th>Rating</th><th>Years left</th><th>Action</th></tr>'+club.players.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.rating+'</td><td>'+p.contract+'</td><td><button class="btn secondary" data-renew="'+p.name+'">Renew</button></td></tr>'}).join('')+'</table></div></section>'}
if(save.tab==='Development'){out+='<section class="panel"><h3>Training & player development</h3><p>Young players improve toward their potential at the end of each season.</p><label>Training focus<select id="training">'+['Balanced','Attacking','Defensive','Fitness'].map(function(x){return '<option '+(x===save.training?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><div class="scroll"><table><tr><th>Player</th><th>Age</th><th>Rating</th><th>Potential</th><th>Fitness</th></tr>'+club.players.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+p.potential+'</td><td>'+p.fitness+'%</td></tr>'}).join('')+'</table></div></section>'}
if(save.tab==='Squad'){out+='<section class="panel"><h3>First-team squad</h3><div class="scroll"><table><thead><tr><th>Player</th><th>Position</th><th>Age</th><th>Rating</th><th>Fitness</th></tr></thead><tbody>'+club.players.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.position+'</td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+p.fitness+'%</td></tr>'}).join('')+'</tbody></table></div></section>'}
if(save.tab==='Tactics'){out+='<section class="panel"><h3>Starting XI preview</h3><div class="pitch">'+club.players.slice(0,11).map(function(p){return '<div class="dot" title="'+esc(p.name)+'">'+p.position+'</div>'}).join('')+'</div></section><section class="panel"><h3>Team instructions</h3><label>Formation<select id="formation">'+['4-3-3','4-2-3-1','3-4-2-1'].map(function(x){return '<option '+(x===save.formation?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><label>Mentality<select id="mentality">'+['Balanced','Attacking','Defensive'].map(function(x){return '<option '+(x===save.mentality?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><label>Pressing<select id="pressing">'+['Standard','High press','Low block'].map(function(x){return '<option '+(x===save.pressing?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><p class="muted">Mentality and pressing affect your attacking strength.</p></section>'}
if(save.tab==='Match Centre'){out+='<section class="panel"><h3>Match Centre</h3>'+(live?liveView():(save.result?'<div class="score">'+esc(save.result.home)+' '+save.result.hg+' — '+save.result.ag+' '+esc(save.result.away)+'</div><p>Possession: '+save.result.pos+'% · Shots: '+save.result.shots+' — '+save.result.oppShots+'</p><p>'+esc(save.result.commentary)+'</p>':'<p>No matches played yet.</p>')+(pair?btn('Watch 2D Match','watch')+' '+btn('Quick Simulate','quickSim'):btn('Start next season','nextSeason')))+ '</section>'}

function play(){var c=clubs[save.club],o=clubs[(save.club+1+save.played)%clubs.length],adv=(c.strength-o.strength)*.04+(save.mentality==='Attacking'?.2:save.mentality==='Defensive'?-.15:0)+(save.pressing==='High press'?.15:save.pressing==='Low block'?-.12:0);var hg=Math.max(0,Math.min(6,Math.floor(Math.random()*3+adv+1))),ag=Math.max(0,Math.min(6,Math.floor(Math.random()*3-adv+.6)));save.result={home:c.name,away:o.name,hg:hg,ag:ag,pos:Math.max(35,Math.min(65,Math.round(50+adv*7))),shots:Math.floor(7+Math.random()*10),oppShots:Math.floor(5+Math.random()*10),commentary:'Full time! '+c.name+' '+hg+'–'+ag+' '+o.name+'.'};save.played++;if(hg>ag)save.wins=(save.wins||0)+1;else if(hg===ag)save.draws=(save.draws||0)+1;else save.losses=(save.losses||0)+1;save.results.push(c.name+' '+hg+'–'+ag+' '+o.name);save.tab='Match Centre';persist();render()}
app.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var mode=b.getAttribute('data-mode');if(mode){gameMode=mode;render();return}var draftAction=b.getAttribute('data-draft');if(draftAction){if(draftAction==='new')draftNew();if(draftAction==='difficulty')draft.difficulty=draft.difficulty==='Classic'?'Expert':'Classic';if(draftAction==='source'){draft.source=draft.source==='Real players'?'Fictional players':'Real players';draft.picks=[];draftSpin()}if(draftAction==='spin')draftSpin();render();return}var draftSlot=b.getAttribute('data-draft-slot');if(draftSlot!==null){var slot=Number(draftSlot);if(draft&&draft.offer&&!draft.picks[slot]&&draftSlots()[slot]===draft.offer.position){draft.picks[slot]=draft.offer;draft.offer=null;if(draft.picks.filter(Boolean).length<11)draftSpin();render()}return}if(b.hasAttribute('data-club')){var input=document.getElementById('manager');if(!input||!input.value.trim()){alert('Please enter your manager name first.');return}save.name=input.value.trim();save.club=Number(b.getAttribute('data-club'));save.played=0;save.leagueGames=[];save.archive=[];save.season=1;save.funds=35;save.rosters=clubs.map(function(c){return c.players.map(function(p){return Object.assign({},p)})});save.transfers=[];persist();render();return}var liveAction=b.getAttribute('data-live');if(liveAction&&live){if(liveAction==='pause')live.paused=!live.paused;if(liveAction==='speed')live.speed=live.speed===1?2:live.speed===2?4:1;if(liveAction==='skip'){finishLive();return}render();return}var league=b.getAttribute('data-league');if(league){save.leagueSection=league;persist();render();return}var tx=b.getAttribute('data-transfer');if(tx){var parts=tx.split(':'),from=Number(parts[0]),name=parts.slice(1).join(':'),p=clubs[from].players.find(function(x){return x.name===name});if(!p)return;var cost=p.value;if(from===save.club){if(clubs[from].players.length<=16){alert('Keep at least 16 players.');return}clubs[from].players=clubs[from].players.filter(function(x){return x!==p});save.funds+=cost;save.transfers.push('Sold '+name+' for £'+cost.toFixed(1)+'m')}else{if(save.funds<cost){alert('Insufficient transfer budget.');return}if(clubs[save.club].players.length>=30){alert('Maximum squad size is 30.');return}clubs[from].players=clubs[from].players.filter(function(x){return x!==p});clubs[save.club].players.push(p);save.funds-=cost;save.transfers.push('Signed '+name+' for £'+cost.toFixed(1)+'m')}save.rosters=clubs.map(function(c){return c.players});persist();render();return}
var renewal=b.getAttribute('data-renew');if(renewal){var p=clubs[save.club].players.find(function(x){return x.name===renewal});if(!p)return;var cost=Math.max(.1,Math.round(p.value*.1*10)/10);if(save.funds<cost){alert('Insufficient budget.');return}save.funds-=cost;p.contract=3;persist();render();return}
var tab=b.getAttribute('data-tab');if(tab){save.tab=tab;persist();render();return}var action=b.getAttribute('data-action');if(action==='draftReset'){draftNew();render()}if(action==='draftFinish'){if(draft&&draft.picks.filter(Boolean).length===11){draftFinish();render()}}if(action==='draftSpin'){draftSpin();render()}if(action==='watch')beginLive();if(action==='quickSim'){if(live)finishLive();else playRound()}if(action==='play')playRound();if(action==='leaguePlay')playRound();if(action==='nextSeason')nextSeason();if(action==='save'){persist();alert('Career saved on this device.')}if(action==='reset'&&confirm('Start a new career?')){save.club=-1;save.played=0;save.result=null;save.wins=0;save.draws=0;save.losses=0;save.results=[];save.leagueGames=[];save.archive=[];save.season=1;persist();render()}});
app.addEventListener('change',function(e){if(e.target.id==='formation')save.formation=e.target.value;if(e.target.id==='mentality')save.mentality=e.target.value;if(e.target.id==='pressing')save.pressing=e.target.value;if(e.target.id==='draft-league'&&draft){draft.league=e.target.value;draft.team='';render()}if(e.target.id==='draft-team'&&draft){draft.team=e.target.value;render()}if(e.target.id==='training')save.training=e.target.value;if(e.target.id==='player-nation'){playerNation=e.target.value;render()}if(e.target.id==='player-search'){playerQuery=e.target.value;render()}persist()});
render();
