<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#140f24"><title>Football Dynasty</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c0915;color:#f6f0ff;font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:#1b102e;border-bottom:1px solid #4c326d;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:1.45rem}h2{margin:0 0 15px}h3{margin:0 0 12px}.muted{color:#b5a7c9}.brand{color:#c7a4ff;font-weight:900}.wrap{max-width:1100px;margin:0 auto;padding:25px 18px}.panel{background:#1b1428;border:1px solid #3a2b50;border-radius:18px;padding:22px;margin-bottom:18px}.hero{background:linear-gradient(120deg,#281445,#51219b)}.btn{border:0;border-radius:11px;background:linear-gradient(120deg,#7c3aed,#a855f7);padding:12px 17px;color:#fff;font-weight:750}.btn.secondary{background:#302242}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.club{border:1px solid #513775;background:#271b39;color:white;padding:16px;border-radius:14px;text-align:left}.club:hover{background:#3c255e}.club strong,.club small{display:block}.club small{color:#c3b6d4;margin-top:5px}input,select{background:#130e1e;border:1px solid #6c5487;border-radius:10px;color:white;padding:12px;width:100%;margin:8px 0 17px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.nav button{border:1px solid #4d3769;background:#1b1428;color:white;border-radius:10px;padding:11px 15px}.nav button.active{background:#6733af}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stats>div{padding:18px;background:#271c38;border-radius:14px}.stats b{display:block;font-size:1.5rem;margin-top:6px}table{border-collapse:collapse;width:100%;min-width:480px}td,th{text-align:left;border-bottom:1px solid #382b4b;padding:11px}th{color:#b9a7d3}.scroll{overflow:auto}.score{font-size:2.6rem;font-weight:900;text-align:center;padding:30px}.pitch{background:linear-gradient(0deg,#124d3a,#166345);border:4px solid #a2d2b7;border-radius:14px;min-height:250px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center;padding:15px}.dot{border-radius:100%;width:48px;height:48px;display:grid;place-items:center;background:#8c4ee8;border:2px solid white;font-size:.75rem}#fatal{background:#3c1b29;padding:20px;border-radius:12px;display:none}footer{color:#9c8ab1;text-align:center;padding:25px}@media(max-width:550px){header{align-items:flex-start;flex-direction:column}.wrap{padding:16px}.panel{padding:17px}.score{font-size:2rem}}
</style></head><body>
<header><div><div class="brand">FD / FOOTBALL DYNASTY</div><h1>Build your football legacy</h1></div><span class="muted">Alpha 0.4 · Club Management</span></header>
<main class="wrap"><div id="fatal" role="alert"></div><div id="app"><section class="panel hero"><h2>Football Dynasty is loading…</h2><p>If this message remains, the game script has not started.</p></section></div></main>
<footer>Fictional clubs and players · Free to play · Your career saves on this device</footer>
<script>
(function(){
'use strict';
var names=['Crown Athletic','Northbridge FC','Harbour City','Kingsport United','Redwood Rovers','Westmere Albion','Riverside 1889','Ironvale FC','Southbank Town','Oakchester','Eastford Wanderers','Bluehaven FC','Ashfield United','Silverton City','Lakeside Athletic','Stonebridge Town','Greenmoor Rovers','Hillcrest FC','Port Victoria','Falconborough'];
var cities=['London','Manchester','Liverpool','Newcastle','Nottingham','Birmingham','Leeds','Sheffield','Bristol','Leicester','Norwich','Derby','Plymouth','York','Oxford','Reading','Coventry','Exeter','Sunderland'];
var first=['Leo','Mason','Elliot','Noah','Oscar','Theo','Max','Isaac','Sam','Finn','Luca','Jamie','Jude','Alex','Harry','Ben','Owen','Callum','Rhys','Tom','Jack','Ethan'];
var last=['Mercer','Vale','Rowan','Hale','Bennett','Sutton','Webb','Cross','Warren','Keane','Drake','Holt','Marsh','Frost','Reid','Parker','Stone','Brooks','Flynn','Cole','Doyle','Hart'];
var clubs=names.map(function(n,i){return {name:n,city:cities[i],strength:78-i,players:Array.from({length:22},function(_,j){return {name:first[(j+i)%first.length]+' '+last[(j*3+i)%last.length],position:j<2?'GK':j<9?'DEF':j<16?'MID':'FWD',age:18+(j*2+i)%16,rating:Math.max(55,78-i+(j*7+i*3)%11-5),fitness:88+(j+i)%13,value:Math.max(.5,Math.round((78-i+(j*7+i*3)%11-5)*.12*10)/10),contract:2+(j%4),potential:Math.min(95,Math.max(55,78-i+(j*7+i*3)%11-5)+4+(j%8))}})}})
var save={name:'',club:-1,tab:'Dashboard',played:0,result:null,formation:'4-3-3',mentality:'Balanced',pressing:'Standard',wins:0,draws:0,losses:0,results:[],season:1,leagueGames:[],archive:[],leagueSection:'Table',funds:35,rosters:null,training:'Balanced',transfers:[]};
try{var raw=localStorage.getItem('football-dynasty-standalone');if(raw){var parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')save=Object.assign(save,parsed)}}catch(e){}
if(!Array.isArray(save.results))save.results=[];if(!Array.isArray(save.leagueGames))save.leagueGames=[];if(save.leagueGames.length&&save.leagueGames[0].length!==10){save.legacyPlayed=(save.legacyPlayed||0)+save.leagueGames.length;save.leagueGames=[];save.played=0;save.result=null;}if(!Array.isArray(save.archive))save.archive=[];if(!save.season)save.season=1;if(save.played&&!save.leagueGames.length){save.legacyPlayed=save.played;save.played=0}save.played=save.leagueGames.length;if(!Array.isArray(save.rosters)||save.rosters.length!==clubs.length)save.rosters=clubs.map(function(c){return c.players.map(function(p){return Object.assign({},p)})});if(!Array.isArray(save.transfers))save.transfers=[];clubs.forEach(function(c,i){c.players=save.rosters[i]});var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function persist(){try{localStorage.setItem('football-dynasty-standalone',JSON.stringify(save))}catch(e){}}
function btn(label,fn){return '<button class="btn" data-action="'+fn+'">'+label+'</button>'}

var rounds=(function(){var a=clubs.map(function(_,i){return i}),r=[],n=a.length;for(var i=0;i<n-1;i++){var m=[];for(var j=0;j<n/2;j++)m.push(i%2?[a[n-1-j],a[j]]:[a[j],a[n-1-j]]);r.push(m);a=[a[0],a[n-1]].concat(a.slice(1,n-1))}return r.concat(r.map(function(m){return m.map(function(p){return [p[1],p[0]]})}))})();
function nextPair(){var m=rounds[save.played];return m&&m.find(function(p){return p.indexOf(save.club)>=0})}
function simulateLeagueGame(h,a){var d=(clubs[h].strength-clubs[a].strength)*.04,gh=0,ga=0;for(var i=0;i<6;i++){if(Math.random()<(1.4+d)/6)gh++;if(Math.random()<(1.2-d)/6)ga++}var events=[];function goals(team,n){for(var j=0;j<n;j++){var ps=clubs[team].players.filter(function(p){return p.position!=='GK'}),sc=ps[Math.floor(Math.random()*ps.length)],as=Math.random()<.75?ps[Math.floor(Math.random()*ps.length)]:null;events.push({team:team,scorer:sc.name,assist:as&&as.name!==sc.name?as.name:null})}}goals(h,gh);goals(a,ga);return {h:h,a:a,hg:gh,ag:ga,events:events}}
function standings(){var t=clubs.map(function(c,i){return {id:i,name:c.name,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});save.leagueGames.forEach(function(r){r.forEach(function(g){var h=t[g.h],a=t[g.a];h.p++;a.p++;h.gf+=g.hg;h.ga+=g.ag;a.gf+=g.ag;a.ga+=g.hg;if(g.hg>g.ag){h.w++;a.l++;h.pts+=3}else if(g.hg<g.ag){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}})});return t.sort(function(a,b){return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf})}
function leagueTable(){return '<section class="panel"><h3>Dynasty League · Season '+save.season+'</h3><div class="scroll"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+standings().map(function(t,i){return '<tr style="'+(t.id===save.club?'background:#392455':'')+'"><td>'+(i+1)+'</td><td>'+esc(t.name)+'</td><td>'+t.p+'</td><td>'+t.w+'</td><td>'+t.d+'</td><td>'+t.l+'</td><td>'+(t.gf-t.ga)+'</td><td>'+t.pts+'</td></tr>'}).join('')+'</table></div></section>'}
function calendar(){return '<section class="panel"><h3>Season '+save.season+' · Fixtures</h3>'+rounds.map(function(r,i){return '<details '+(i===save.played?'open':'')+'><summary>Matchday '+(i+1)+(i<save.played?' ✓':'')+'</summary>'+r.map(function(p,j){var g=save.leagueGames[i]&&save.leagueGames[i][j];return '<p>'+esc(clubs[p[0]].name)+' '+(g?g.hg+' — '+g.ag:'vs')+' '+esc(clubs[p[1]].name)+'</p>'}).join('')+'</details>'}).join('')+'</section>'}
function rankings(kind){var list={};save.leagueGames.forEach(function(r){r.forEach(function(g){g.events.forEach(function(e){var key=e.team+'-'+e.scorer;if(!list[key])list[key]={name:e.scorer,club:clubs[e.team].name,goals:0,assists:0};list[key].goals++;if(e.assist){var k=e.team+'-'+e.assist;if(!list[k])list[k]={name:e.assist,club:clubs[e.team].name,goals:0,assists:0};list[k].assists++}})})});return '<section class="panel"><h3>Top '+(kind==='goals'?'Goalscorers':'Assist Providers')+'</h3><div class="scroll"><table><tr><th>#</th><th>Player</th><th>Club</th><th>'+kind+'</th></tr>'+Object.values(list).sort(function(a,b){return b[kind]-a[kind]}).slice(0,20).map(function(p,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.club)+'</td><td>'+p[kind]+'</td></tr>'}).join('')+'</table></div></section>'}
function playRound(){if(save.played>=rounds.length)return;var games=rounds[save.played].map(function(p){return simulateLeagueGame(p[0],p[1])}),g=games.find(function(x){return x.h===save.club||x.a===save.club});save.leagueGames.push(games);save.played=save.leagueGames.length;save.result={home:clubs[g.h].name,away:clubs[g.a].name,hg:g.hg,ag:g.ag,pos:50,shots:8+g.hg*2,oppShots:8+g.ag*2,commentary:'Matchday '+save.played+' complete. All five games simulated.'};save.results.push(save.result.home+' '+g.hg+'–'+g.ag+' '+save.result.away);save.tab='Match Centre';persist();render()}
function nextSeason(){if(save.played!==rounds.length)return;var t=standings(),i=t.findIndex(function(x){return x.id===save.club});save.archive.unshift({season:save.season,champion:t[0].name,position:i+1});save.season++;save.played=0;save.leagueGames=[];save.result=null;save.tab='Dashboard';save.funds+=10+(clubs.length-i)*.7;clubs.forEach(function(c){c.players.forEach(function(p){p.age++;p.contract=Math.max(0,p.contract-1);if(p.age<28&&p.rating<p.potential&&Math.random()<.55){p.rating++;p.value=Math.round(p.value*1.07*10)/10}if(p.age>32&&Math.random()<.3)p.rating=Math.max(40,p.rating-1);p.fitness=Math.min(100,p.fitness+(save.training==='Fitness'?5:2))})});save.rosters=clubs.map(function(c){return c.players});persist();render()}

function render(){
if(save.club<0||save.club>=clubs.length){app.innerHTML='<section class="panel hero"><h2>Start your managerial career</h2><p>Choose your name and take charge of one of ten fictional clubs.</p><label>Manager name<input id="manager" placeholder="Your name" value="'+esc(save.name)+'"></label><h3>Choose your club</h3><div class="grid">'+clubs.map(function(c,i){return '<button class="club" data-club="'+i+'"><strong>'+esc(c.name)+'</strong><small>'+esc(c.city)+' · Reputation '+c.strength+'</small></button>'}).join('')+'</div></section>';return}
var club=clubs[save.club],pair=nextPair(),opp=pair?clubs[pair[0]===save.club?pair[1]:pair[0]]:null;
var tabs=['Dashboard','League','Squad','Transfers','Contracts','Development','Tactics','Match Centre'];
var out='<div class="nav">'+tabs.map(function(t){return '<button data-tab="'+t+'" class="'+(save.tab===t?'active':'')+'">'+t+'</button>'}).join('')+'</div><section class="panel hero"><span class="muted">MANAGER '+esc(save.name.toUpperCase())+' · SEASON '+save.season+'</span><h2>'+esc(club.name)+'</h2><p>'+esc(club.city)+' · Dynasty League · Matches played: '+save.played+'</p></section>';
if(save.tab==='Dashboard'){out+='<div class="stats"><div>Transfer budget<b>£'+(8+club.strength*.31).toFixed(1)+'m</b></div><div>Club reputation<b>'+club.strength+'</b></div><div>Matches played<b>'+save.played+'</b></div></div><section class="panel"><h3>Next fixture</h3><p>'+(pair?esc(clubs[pair[0]].name)+' vs '+esc(clubs[pair[1]].name):'Season complete')+'</p>'+(pair?btn('Simulate Matchday '+(save.played+1),'leaguePlay'):btn('Start next season','nextSeason'))+'</section><section class="panel"><h3>Key players</h3>'+club.players.slice().sort(function(a,b){return b.rating-a.rating}).slice(0,5).map(function(p){return '<p>'+esc(p.name)+' · '+p.position+' · '+p.rating+' OVR</p>'}).join('')+'</section>'}
if(save.tab==='Dashboard')out+=leagueTable();if(save.tab==='League'){out+='<div class="nav">'+['Table','Fixtures','Goals','Assists','Stats','History'].map(function(t){return '<button data-league="'+t+'" class="'+(save.leagueSection===t?'active':'')+'">'+t+'</button>'}).join('')+'</div>';if(save.leagueSection==='Table')out+=leagueTable();if(save.leagueSection==='Fixtures')out+=calendar();if(save.leagueSection==='Goals')out+=rankings('goals');if(save.leagueSection==='Assists')out+=rankings('assists');if(save.leagueSection==='Stats')out+='<section class="panel"><h3>League statistics</h3><p>'+clubs.length+' teams · '+rounds.length+' matchdays · '+(save.played*clubs.length/2)+' matches played</p></section>';if(save.leagueSection==='History')out+='<section class="panel"><h3>Past champions</h3>'+(save.archive.length?save.archive.map(function(a){return '<p>Season '+a.season+': '+esc(a.champion)+' · Your finish: '+a.position+'</p>'}).join(''):'<p>Complete a season to see the history.</p>')+'</section>'}
if(save.tab==='Season Stats'){out+='<section class="panel"><h3>Your career record</h3><div class="stats"><div>Wins<b>'+ (save.wins||0) +'</b></div><div>Draws<b>'+ (save.draws||0) +'</b></div><div>Losses<b>'+ (save.losses||0) +'</b></div><div>Points<b>'+ ((save.wins||0)*3+(save.draws||0)) +'</b></div></div></section><section class="panel"><h3>Recent results</h3>'+(save.results.length?save.results.slice().reverse().map(function(x){return '<p style="border-bottom:1px solid #3b2b50;padding:9px 0">'+esc(x)+'</p>'}).join(''):'<p>No games played yet.</p>')+'</section>'}
if(save.tab==='Transfers'){out+='<section class="panel"><h3>Transfer market</h3><p class="muted">Available budget: £'+save.funds.toFixed(1)+'m. Buy players from rival clubs or sell your own players.</p><div class="scroll"><table><tr><th>Player</th><th>Club</th><th>Position</th><th>Rating</th><th>Value</th><th>Action</th></tr>'+clubs.map(function(c,ci){return c.players.filter(function(p){return p.position!=='GK'}).slice(0,7).map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+esc(c.name)+'</td><td>'+p.position+'</td><td>'+p.rating+'</td><td>£'+p.value.toFixed(1)+'m</td><td><button class="btn secondary" data-transfer="'+ci+':'+p.name+'">'+(ci===save.club?'Sell':'Buy')+'</button></td></tr>'}).join('')}).join('')+'</table></div></section>'}
if(save.tab==='Contracts'){out+='<section class="panel"><h3>Contracts</h3><p class="muted">Renew a contract for 3 seasons at 10% of player value. Budget: £'+save.funds.toFixed(1)+'m.</p><div class="scroll"><table><tr><th>Player</th><th>Rating</th><th>Years left</th><th>Action</th></tr>'+club.players.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.rating+'</td><td>'+p.contract+'</td><td><button class="btn secondary" data-renew="'+p.name+'">Renew</button></td></tr>'}).join('')+'</table></div></section>'}
if(save.tab==='Development'){out+='<section class="panel"><h3>Training & player development</h3><p>Young players improve toward their potential at the end of each season.</p><label>Training focus<select id="training">'+['Balanced','Attacking','Defensive','Fitness'].map(function(x){return '<option '+(x===save.training?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><div class="scroll"><table><tr><th>Player</th><th>Age</th><th>Rating</th><th>Potential</th><th>Fitness</th></tr>'+club.players.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+p.potential+'</td><td>'+p.fitness+'%</td></tr>'}).join('')+'</table></div></section>'}
if(save.tab==='Squad'){out+='<section class="panel"><h3>First-team squad</h3><div class="scroll"><table><thead><tr><th>Player</th><th>Position</th><th>Age</th><th>Rating</th><th>Fitness</th></tr></thead><tbody>'+club.players.map(function(p){return '<tr><td>'+esc(p.name)+'</td><td>'+p.position+'</td><td>'+p.age+'</td><td>'+p.rating+'</td><td>'+p.fitness+'%</td></tr>'}).join('')+'</tbody></table></div></section>'}
if(save.tab==='Tactics'){out+='<section class="panel"><h3>Starting XI preview</h3><div class="pitch">'+club.players.slice(0,11).map(function(p){return '<div class="dot" title="'+esc(p.name)+'">'+p.position+'</div>'}).join('')+'</div></section><section class="panel"><h3>Team instructions</h3><label>Formation<select id="formation">'+['4-3-3','4-2-3-1','3-4-2-1'].map(function(x){return '<option '+(x===save.formation?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><label>Mentality<select id="mentality">'+['Balanced','Attacking','Defensive'].map(function(x){return '<option '+(x===save.mentality?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><label>Pressing<select id="pressing">'+['Standard','High press','Low block'].map(function(x){return '<option '+(x===save.pressing?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><p class="muted">Mentality and pressing affect your attacking strength.</p></section>'}
if(save.tab==='Match Centre'){out+='<section class="panel"><h3>Match Centre</h3>'+(save.result?'<div class="score">'+esc(save.result.home)+' '+save.result.hg+' — '+save.result.ag+' '+esc(save.result.away)+'</div><p>Possession: '+save.result.pos+'% · Shots: '+save.result.shots+' — '+save.result.oppShots+'</p><p>'+esc(save.result.commentary)+'</p>':'<p>No matches played yet.</p>')+(pair?btn('Play next matchday','leaguePlay'):btn('Start next season','nextSeason'))+'</section>'}
out+='<button class="btn secondary" data-action="save">Save career</button> <button class="btn secondary" data-action="reset">New career</button>';app.innerHTML=out;
}
function play(){var c=clubs[save.club],o=clubs[(save.club+1+save.played)%clubs.length],adv=(c.strength-o.strength)*.04+(save.mentality==='Attacking'?.2:save.mentality==='Defensive'?-.15:0)+(save.pressing==='High press'?.15:save.pressing==='Low block'?-.12:0);var hg=Math.max(0,Math.min(6,Math.floor(Math.random()*3+adv+1))),ag=Math.max(0,Math.min(6,Math.floor(Math.random()*3-adv+.6)));save.result={home:c.name,away:o.name,hg:hg,ag:ag,pos:Math.max(35,Math.min(65,Math.round(50+adv*7))),shots:Math.floor(7+Math.random()*10),oppShots:Math.floor(5+Math.random()*10),commentary:'Full time! '+c.name+' '+hg+'–'+ag+' '+o.name+'.'};save.played++;if(hg>ag)save.wins=(save.wins||0)+1;else if(hg===ag)save.draws=(save.draws||0)+1;else save.losses=(save.losses||0)+1;save.results.push(c.name+' '+hg+'–'+ag+' '+o.name);save.tab='Match Centre';persist();render()}
app.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-club')){var input=document.getElementById('manager');if(!input||!input.value.trim()){alert('Please enter your manager name first.');return}save.name=input.value.trim();save.club=Number(b.getAttribute('data-club'));save.played=0;save.leagueGames=[];save.archive=[];save.season=1;save.funds=35;save.rosters=clubs.map(function(c){return c.players});save.transfers=[];persist();render();return}var league=b.getAttribute('data-league');if(league){save.leagueSection=league;persist();render();return}var tx=b.getAttribute('data-transfer');if(tx){var parts=tx.split(':'),from=Number(parts[0]),name=parts.slice(1).join(':'),p=clubs[from].players.find(function(x){return x.name===name});if(!p)return;var cost=p.value;if(from===save.club){if(clubs[from].players.length<=16){alert('Keep at least 16 players.');return}clubs[from].players=clubs[from].players.filter(function(x){return x!==p});save.funds+=cost;save.transfers.push('Sold '+name+' for £'+cost.toFixed(1)+'m')}else{if(save.funds<cost){alert('Insufficient transfer budget.');return}if(clubs[save.club].players.length>=30){alert('Maximum squad size is 30.');return}clubs[from].players=clubs[from].players.filter(function(x){return x!==p});clubs[save.club].players.push(p);save.funds-=cost;save.transfers.push('Signed '+name+' for £'+cost.toFixed(1)+'m')}save.rosters=clubs.map(function(c){return c.players});persist();render();return}
var renewal=b.getAttribute('data-renew');if(renewal){var p=clubs[save.club].players.find(function(x){return x.name===renewal});if(!p)return;var cost=Math.max(.1,Math.round(p.value*.1*10)/10);if(save.funds<cost){alert('Insufficient budget.');return}save.funds-=cost;p.contract=3;persist();render();return}
var tab=b.getAttribute('data-tab');if(tab){save.tab=tab;persist();render();return}var action=b.getAttribute('data-action');if(action==='play')playRound();if(action==='leaguePlay')playRound();if(action==='nextSeason')nextSeason();if(action==='save'){persist();alert('Career saved on this device.')}if(action==='reset'&&confirm('Start a new career?')){save.club=-1;save.played=0;save.result=null;save.wins=0;save.draws=0;save.losses=0;save.results=[];save.leagueGames=[];save.archive=[];save.season=1;persist();render()}});
app.addEventListener('change',function(e){if(e.target.id==='formation')save.formation=e.target.value;if(e.target.id==='mentality')save.mentality=e.target.value;if(e.target.id==='pressing')save.pressing=e.target.value;if(e.target.id==='training')save.training=e.target.value;persist()});
render();
})();
</script></body></html>
